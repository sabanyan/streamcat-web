{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="container">
    <div class="row mt-40px">
        <div class="col-4 offset-4">
            <div class="panel panel-default">
                <div class="panel-body">
                    <form action="{{ original_url }}" method="post">
                      <div class="form-group">
                          <label for="login_email">ユーザアカウント</label>
                          <input id="login_email" name="email" type="text" class="form-control form-control-sm"
                                 placeholder="メールアドレス" name="email" value="{{ email }}">
                      </div>
                      <div class="form-group">
                          <label for="login_password">パスワード</label>
                          <input id="login_password" type="password" class="form-control form-control-sm"
                                 placeholder="パスワード"  name="password">
                      </div>
                      <div class="form-group">
                          <input type="submit" class="btn btn-primary btn-default btn-block" value="ログイン">
                      </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
