{% extends "base.html" %}
{% block title %}
{% endblock %}

{% block content %}
<div class="modal-content">
  <form method="post">
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">新しいフローを作成する</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="mb-32px">
        <label>
          前処理対象のCSVファイル
        </label>
        <div>
          <input id="new_flow_data" name="file" type="file">
        </div>
      </div>
      <div>
        <label>
          フロー名称
        </label>
        <input id="new_flow_name" type="text" class="form-control mb-8px" name="file_name" placeholder="フロー名称">
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal">キャンセル</button>
      <button class="btn btn-secondary" type="submit">
        作成する
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block footer_scripts %}
<script>
$(function() {
  $('#new_flow_modal').find('form').on('submit',function() {
    var formData = new FormData();
    var file = $('#new_flow_data').prop('files')[0];
    console.log(file)
    formData.append('file', file);
    formData.append('file_name', file.name);
    sendFormData('/api/v0/frames/new', formData).done(function(response) {
      console.log(response);

      // let data = {
      //   project_uuid: project_uuid,
      //   name: document.getElementById('new_flow_name').value,
      //   data_source_name: file.name
      // }
      //
      // sendJsonData('POST', '/api/v0-1/flows/new', data, function(){
      //   window.location.href = '/projects/' + project_uuid + "/dataflows";
      // });

    }).fail(function(err) {
      console.log(err)
    });
    return false;
  })
});

function sendFormData(url, formData) {
  return $.ajax({
    url: url,
    type: 'post',
    processData: false,
    contentType: false,
    data: formData
  });
}
</script>
{% endblock %}
