{% extends "common/base.html" %}
{% block content %}
<div id="visualize">
    <table class="s-tbl">
        <thead>
            <tr>
                {% for head in header %}
                <th style="white-space: nowrap;">{{ head }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {% for row in reader %}
            <tr>
                {% for datum in row %}
                <td style="white-space: nowrap;">{{ datum }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
